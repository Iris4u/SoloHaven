<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoloHaven — Soft Active Comfort</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Dynamic Soft Light Color Palette Variables */
            --bg-base: #f7f4ef;
            --bg-card: rgba(255, 255, 255, 0.75);
            --text-primary: #2e332f;
            --text-secondary: #656d67;
            --accent-soft: #e5ece6;
            --accent-border: #d0ded3;
            --shadow-soft: 0 12px 32px rgba(0, 0, 0, 0.03);
            --radius-main: 24px;
            --radius-sm: 16px;
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 6 Aesthetic Soft-Light Color Palettes per Mood */
        body[data-mood="blank"] {
            --bg-base: #f5f2f5;
            --accent-soft: #eae3ed;
            --accent-border: #d8cde0;
        }
        body[data-mood="overwhelmed"] {
            --bg-base: #f2f5f7;
            --accent-soft: #e1e9ee;
            --accent-border: #cad7e0;
        }
        body[data-mood="homesick"] {
            --bg-base: #f9f4f0;
            --accent-soft: #f4e7df;
            --accent-border: #e6d3c7;
        }
        body[data-mood="stimulated"] {
            --bg-base: #f5f7f2;
            --accent-soft: #e5ede3;
            --accent-border: #cfdecb;
        }
        body[data-mood="restless"] {
            --bg-base: #faf5ee;
            --accent-soft: #f5e9d8;
            --accent-border: #ebd5bc;
        }
        body[data-mood="latenight"] {
            --bg-base: #f0f2f7;
            --accent-soft: #dfa8ef;
            --accent-soft: #e1e5f2;
            --accent-border: #c8cfe3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            transition: var(--transition-smooth);
        }

        .app-container {
            width: 100%;
            max-width: 880px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: var(--radius-main);
            padding: 40px;
            box-shadow: var(--shadow-soft);
            transition: var(--transition-smooth);
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.3rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 400;
        }

        .section-title {
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 600;
        }

        /* 6 Mood Grid */
        .mood-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 36px;
        }

        .mood-btn {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid var(--accent-border);
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition-smooth);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .mood-btn:hover {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(0,0,0,0.03);
        }

        .mood-btn.active {
            background: var(--text-primary);
            color: #ffffff;
            border-color: var(--text-primary);
        }

        /* Dynamic Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 16px;
        }

        .card {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: var(--radius-sm);
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition-smooth);
            cursor: pointer;
            min-height: 170px;
        }

        .card:hover {
            background: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            border-color: var(--accent-border);
        }

        .card-type {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.35;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .card-action {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Active Cozy Date View */
        .date-view {
            display: none;
            background: #ffffff;
            border-radius: var(--radius-sm);
            padding: 32px;
            border: 1px solid var(--accent-border);
            animation: fadeIn 0.4s ease;
        }

        .date-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--accent-soft);
        }

        .date-tag {
            display: inline-block;
            background: var(--accent-soft);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .date-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
        }

        .recipe-box {
            background: var(--bg-base);
            border-radius: var(--radius-sm);
            padding: 20px;
            margin-bottom: 24px;
            transition: var(--transition-smooth);
        }

        .recipe-task {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 6px;
        }

        .recipe-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .external-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-soft);
            color: var(--text-primary);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 24px;
            transition: var(--transition-smooth);
        }

        .external-btn:hover {
            background: var(--accent-border);
        }

        .timer-container {
            text-align: center;
            padding: 24px 0;
            background: rgba(247, 245, 240, 0.5);
            border-radius: var(--radius-sm);
            margin-bottom: 24px;
        }

        .timer-display {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }

        .timer-btn {
            background: var(--text-primary);
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .timer-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .done-btn {
            width: 100%;
            background: var(--text-primary);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .done-btn:hover {
            opacity: 0.92;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .hidden { display: none !important; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .app-container { padding: 24px; }
            .mood-grid { grid-template-columns: 1fr; }
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

    let currentMood = 'blank';
    let timerInterval = null;
    let timerSeconds = 35 * 60;
    let isTimerRunning = false;

    // Soft Helper: Dynamically pick 1 item without hardcoding
    function getRandomItem(array) {
        return array[Math.floor(Math.random() * array.length)];
    }

    // Render 6 Mood Selection Buttons
    function initMoods() {
        const moodContainer = document.getElementById('mood-selector');
        moodContainer.innerHTML = '';
        
        Object.keys(moodData).forEach(key => {
            const m = moodData[key];
            const btn = document.createElement('button');
            btn.className = `mood-btn ${key === currentMood ? 'active' : ''}`;
            btn.innerHTML = `<span>${m.icon}</span> <span>${m.label}</span>`;
            btn.onclick = () => {
                currentMood = key;
                document.body.setAttribute('data-mood', key);
                initMoods();
                renderOptions();
            };
            moodContainer.appendChild(btn);
        });
    }

    // Dynamic Option Generator: Picks fresh recommendations from the 4 categories whenever called
    function renderOptions() {
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        const data = moodData[currentMood];
        const categories = [
            { key: 'book', label: '📖 Book', pool: data.books },
            { key: 'drama', label: '📺 Asian Drama', pool: data.dramas },
            { key: 'movie', label: '🎬 Movie Segment', pool: data.movies },
            { key: 'music', label: '🎧 Music / Soundscape', pool: data.music }
        ];

        categories.forEach(cat => {
            const selectedItem = getRandomItem(cat.pool);
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div>
                    <div class="card-type">${cat.label}</div>
                    <div class="card-title">${selectedItem.title}</div>
                    <div class="card-meta">${selectedItem.meta}</div>
                </div>
                <div class="card-action">Start Cozy Date ➔</div>
            `;
            card.onclick = () => openCozyDate(cat.key, selectedItem);
            container.appendChild(card);
        });
    }

    // Open Date Experience View
    function openCozyDate(categoryKey, item) {
        const recipe = recipeMappings[categoryKey];

        document.getElementById('main-view').classList.add('hidden');
        document.getElementById('date-view').style.display = 'block';

        document.getElementById('view-type').innerText = recipe.typeTag;
        document.getElementById('view-title').innerText = item.title;
        document.getElementById('view-meta').innerText = item.meta;

        document.getElementById('recipe-task').innerText = recipe.taskTitle;
        document.getElementById('recipe-desc').innerText = recipe.desc;

        const extBtn = document.getElementById('external-link');
        extBtn.href = recipe.getLink(item.query || item.title);

        resetTimer(35);
    }

    // Navigation and completion handlers
    function resetToMain() {
        stopTimer();
        document.getElementById('date-view').style.display = 'none';
        document.getElementById('main-view').classList.remove('hidden');
    }

    function completeCozyDate() {
        resetToMain();
        renderOptions(); // Dynamically generates brand new options upon completion
    }

    // Focus Timer Controls
    function updateTimerDisplay() {
        const mins = Math.floor(timerSeconds / 60);
        const secs = timerSeconds % 60;
        document.getElementById('timer-display').innerText = 
            `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function toggleTimer() {
        if (isTimerRunning) {
            stopTimer();
        } else {
            isTimerRunning = true;
            document.getElementById('timer-btn').innerText = 'Pause Timer';
            timerInterval = setInterval(() => {
                if (timerSeconds > 0) {
                    timerSeconds--;
                    updateTimerDisplay();
                } else {
                    stopTimer();
                    alert("Cozy focus session complete! Take a soft breath.");
                }
            }, 1000);
        }
    }

    function stopTimer() {
        clearInterval(timerInterval);
        isTimerRunning = false;
        document.getElementById('timer-btn').innerText = 'Start Timer';
    }

    function resetTimer(minutes) {
        stopTimer();
        timerSeconds = minutes * 60;
        updateTimerDisplay();
    }

    // Initial Execution
    document.body.setAttribute('data-mood', currentMood);
    initMoods();
    renderOptions();
</script>
</body>
</html>
